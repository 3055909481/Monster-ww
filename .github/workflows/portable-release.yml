# Monster-ww portable build (PyInstaller, full-update).
#
# The GUI window belongs to Monster-ww.exe itself, whose VERSIONINFO says
# ProductName=Monster-ww. Windows taskbar therefore groups it under
# "Monster-ww" instead of "Python" (the old pyappify layout hosted the window
# in pythonw.exe, whose version resource says "Python").
#
# Distribution is a full zip: every release replaces the program directory.
# User data (accounts, schedules, history) lives in %APPDATA%/Monster-ww/configs
# and is copied there from a legacy in-app configs/ on first run, so it
# survives a full package replacement.
#
# Source obfuscation: every runtime module is Cython-compiled to .pyd; the
# patch modules that install runtime monkeypatches stay as source because
# Cython functions cannot bind self when assigned onto framework classes.

name: Monster-ww Portable Release
run-name: Monster-ww portable · ${{ inputs.version || format('auto run {0}', github.run_number) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, e.g. v3.8.1. Leave empty to auto-generate the next patch version.'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Also create a GitHub Release with the archive.'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: monster-portable-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: 'utf-8'
  PYTHONLEGACYWINDOWSSTDIO: 'utf-8'

jobs:
  build:
    name: Build portable archive
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Configure runner
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Resolve version tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $tag = "$env:INPUT_VERSION".Trim()
          $maxMajor = 0; $maxMinor = 0; $maxPatch = 0
          $rawTags = (& git tag -l "v*" | Out-String).Trim()
          foreach ($existingTag in ($rawTags -split "`n")) {
            if ($existingTag.Trim() -match '^v?(\d+)\.(\d+)\.(\d+)$') {
              $curMajor = [int]$Matches[1]; $curMinor = [int]$Matches[2]; $curPatch = [int]$Matches[3]
              if (($curMajor -gt $maxMajor) -or
                  ($curMajor -eq $maxMajor -and $curMinor -gt $maxMinor) -or
                  ($curMajor -eq $maxMajor -and $curMinor -eq $maxMinor -and $curPatch -gt $maxPatch)) {
                $maxMajor = $curMajor; $maxMinor = $curMinor; $maxPatch = $curPatch
              }
            }
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = if ($maxMajor -eq 0 -and $maxMinor -eq 0 -and $maxPatch -eq 0) { 'v1.0.0' }
                   else { "v$maxMajor.$maxMinor.$($maxPatch + 1)" }
          } elseif ($tag -match '^v?(\d+)\.(\d+)\.(\d+)((?:[-.](?:alpha|beta|rc)(?:\.\d+)?)?)$') {
            $inMajor = [int]$Matches[1]; $inMinor = [int]$Matches[2]; $inPatch = [int]$Matches[3]
            $suffix = $Matches[4]
            $newer = ($inMajor -gt $maxMajor) -or
                     ($inMajor -eq $maxMajor -and $inMinor -gt $maxMinor) -or
                     ($inMajor -eq $maxMajor -and $inMinor -eq $maxMinor -and $inPatch -gt $maxPatch)
            if (-not $newer) { $tag = "v$($maxMajor + 1).0.0$suffix" }
          }
          $used = @((& git tag -l | Out-String).Trim() -split "`n" | ForEach-Object { $_.Trim() })
          while ($used -contains $tag) {
            if ($tag -match '^v(\d+)\.(\d+)\.(\d+)(.*)$') {
              $tag = "v$([int]$Matches[1]).$([int]$Matches[2]).$([int]$Matches[3] + 1)$($Matches[4])"
            } else { break }
          }
          if ($tag -notmatch '^v?\d+\.\d+\.\d+(?:[-.](?:alpha|beta|rc)(?:\.\d+)?)?$') {
            throw "Version '$tag' is not a valid version tag (use v1.2.3)."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "number=$($tag -replace '^v', '')" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$tag" >> $env:GITHUB_ENV
          Write-Host "Packaging version tag: $tag"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build toolchain
        run: python -m pip install --disable-pip-version-check "cython>=3" "setuptools>=77" "pyinstaller>=6"

      - name: Generate character source snapshots
        run: python .github/scripts/build_char_sources.py

      - name: Compile runtime sources to native extensions
        run: python setup.py build_ext --inplace --force --parallel 4

      - name: Verify compiled modules
        run: |
          $count = @(Get-ChildItem -Recurse -Filter '*.cp312-win_amd64.pyd' -ErrorAction SilentlyContinue).Count
          Write-Host "Compiled $count native modules."
          if ($count -lt 100) { throw "Expected 100+ compiled modules, got $count." }
          if (-not (Test-Path 'src/task/BaseWWTask.cp312-win_amd64.pyd')) { throw 'BaseWWTask.pyd missing.' }
          if (-not (Test-Path 'config.cp312-win_amd64.pyd')) { throw 'config.pyd missing.' }
          if (-not (Test-Path 'build/char_sources/BaseChar.py')) { throw 'char_sources snapshot missing.' }

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests against compiled modules
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: 'offscreen'
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: ./run_tests.ps1

      - name: Strip Python sources from the build tree
        run: |
          $stripped = 0
          Get-ChildItem -Recurse -Filter '*.py' src | Where-Object {
            $_.Name -notin @('__init__.py', 'identity.py', 'schedule_patch.py', 'adaptive_interval.py', 'team_overlay.py', 'click_jitter.py') -and
            (Test-Path ($_.FullName -replace '\.py$', '.cp312-win_amd64.pyd'))
          } | ForEach-Object { Remove-Item $_.FullName; $stripped++ }
          if (Test-Path config.py) { Remove-Item config.py; $stripped++ }
          if ($stripped -lt 100) { throw "Expected to strip 100+ sources, stripped $stripped" }
          "Stripped $stripped source files; the package ships compiled modules only."

      - name: Build portable app with PyInstaller
        run: python -m PyInstaller --noconfirm Monster-ww.spec

      - name: Drop runtime caches from the package
        # OpenVINO writes compiled .blob caches at runtime. collect_all() may
        # pick up a cache/ folder from the build machine; it is regenerated on
        # first launch and must not ship (31 MB in v1.0.27).
        run: |
          $cache = 'dist/Monster-ww/cache'
          if (Test-Path $cache) {
            $size = (Get-ChildItem $cache -Recurse -File | Measure-Object Length -Sum).Sum
            Write-Host "Removing bundled runtime cache ($([math]::Round($size/1MB,1)) MB)"
            Remove-Item $cache -Recurse -Force
          }
          Get-ChildItem -Recurse -Filter '__pycache__' 'dist/Monster-ww' | Remove-Item -Recurse -Force

      - name: Verify executable metadata
        run: |
          $exe = 'dist/Monster-ww/Monster-ww.exe'
          if (-not (Test-Path $exe)) { throw "Executable missing: $exe" }
          $identity = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))
          Write-Host "ProductName=$($identity.ProductName) FileDescription=$($identity.FileDescription) ProductVersion=$($identity.ProductVersion)"
          if ($identity.ProductName -ne 'Monster-ww') { throw "ProductName mismatch: $($identity.ProductName)" }
          if ($identity.FileDescription -ne 'Monster-ww') { throw "FileDescription mismatch: $($identity.FileDescription)" }

      - name: Verify packaged tree has no readable business source
        run: |
          $leaks = Get-ChildItem -Recurse -Filter '*.py' dist/Monster-ww/src | Where-Object {
            $_.Name -notin @('__init__.py', 'identity.py', 'schedule_patch.py', 'adaptive_interval.py', 'team_overlay.py', 'click_jitter.py')
          }
          if ($leaks) { $leaks | ForEach-Object { Write-Host "LEAK: $($_.FullName)" }; throw 'Readable business source leaked into package.' }
          $required = @('dist/Monster-ww/Monster-ww.exe', 'dist/Monster-ww/src/identity.py',
                        'dist/Monster-ww/workshop_bundle/teams.json')
          foreach ($f in $required) { if (-not (Test-Path $f)) { throw "Missing required file: $f" } }

      - name: Verify exe requires administrator
        # PyInstaller 6 overwrites requestedExecutionLevel from uac_admin;
        # fail the build instead of shipping a medium-integrity executable.
        run: python .github/scripts/patch_launcher_manifest.py --verify dist/Monster-ww/Monster-ww.exe

      - name: Smoke-test packaged app
        # GitHub-hosted runners already run elevated, so the requireAdministrator
        # manifest does not trigger an interactive UAC prompt here. Limit PATH
        # to the packaged tree so developer-installed DLLs cannot mask a
        # missing-bundle bug (same trick xjtu uses), and force offscreen Qt.
        env:
          QT_QPA_PLATFORM: 'offscreen'
        run: |
          $exe = (Resolve-Path 'dist/Monster-ww/Monster-ww.exe').Path
          $stdout = Join-Path (Get-Location) 'smoke-stdout.log'
          $stderr = Join-Path (Get-Location) 'smoke-stderr.log'
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 20
          $proc.Refresh()
          if ($proc.HasExited) {
            Get-Content $stderr -Tail 40
            throw "Packaged app exited early with code $($proc.ExitCode)"
          }
          $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
          if ($err -match 'Traceback \(most recent call last\)|ModuleNotFoundError|ImportError') {
            Get-Content $stderr -Tail 40
            throw 'Packaged app raised a startup traceback.'
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "Packaged app started successfully (pid $($proc.Id))."

      - name: Package portable archive
        run: |
          $metadata = [ordered]@{
            version = $env:APP_VERSION
            commit = $env:GITHUB_SHA
            run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            python = (python --version)
          }
          $metadata | ConvertTo-Json | Set-Content 'dist/Monster-ww/build-info.json' -Encoding utf8
          # version.txt is read by src/updater.py to know the running version.
          $env:APP_VERSION | Set-Content 'dist/Monster-ww/version.txt' -Encoding ascii -NoNewline
          # 7z solid LZMA2 is ~25% smaller than zip (244MB vs 324MB measured).
          $seven = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $seven) { $seven = Join-Path $env:ProgramFiles '7-Zip/7z.exe' }
          if (-not (Test-Path $seven)) { throw '7-Zip is required to build the portable archive.' }
          $archiveName = "Monster-ww-$env:APP_VERSION-windows-x64.7z"
          $archive = Join-Path (Get-Location) "dist/$archiveName"
          # Compress from inside dist/ so the archive root is Monster-ww/.
          Push-Location 'dist'
          & $seven a -t7z -mx=5 -ms=on $archive 'Monster-ww' | Out-Null
          Pop-Location
          if ($LASTEXITCODE -ne 0) { throw '7z compression failed.' }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content "$archive.sha256" -Encoding ascii
          @("Version: $env:APP_VERSION", "Package: $archiveName", "SHA-256: $hash") -join "`n`n" | Add-Content $env:GITHUB_STEP_SUMMARY
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: Monster-ww-portable-${{ steps.version.outputs.number }}
          path: |
            dist/Monster-ww-*.7z
            dist/Monster-ww-*.7z.sha256

      - name: Publish GitHub release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Monster-ww ${{ steps.version.outputs.number }} (portable)
          draft: false
          prerelease: false
          body: |
            ### Monster-ww 便携版（PyInstaller 全量包）

            解压后双击 `Monster-ww/Monster-ww.exe` 启动。

            - **任务栏分组显示为 Monster-ww**：GUI 窗口由带版本资源的独立 exe 承载，不再归到 Python 分组
            - **必须以管理员权限运行**：exe 内置 `requireAdministrator` 清单，双击会弹出一次 UAC 提权。鸣潮客户端是管理员权限，脚本若普通权限启动，`PostMessage` 会被 UIPI 拦截，表现为点击按键无反应
            - **配置保留**：账号、计划和运行历史保存在 `%APPDATA%/Monster-ww/configs`，升级时全量替换程序目录也不会丢失；旧版 `configs/` 会在首次启动时自动迁移过去
            - **应用内自动更新**：「关于」页可检测更新、选择版本升级，更新后自动重启；启动时也会检测一次。也可手动下载 7z 解压覆盖程序目录，配置不受影响
            - **队伍创意工坊完全离线**：`workshop_bundle/` 内置全部队伍配置，浏览导入不访问外部 CDN
            - **源码保护**：业务模块编译为 `.pyd`，仅保留必要的运行时补丁源码
            - Python 环境与依赖已随包提供，首次运行无需联网下载
            - 7z 请用 7-Zip 或 Windows 11 23H2+ 解压
            - 由手动触发的 `Monster-ww Portable Release` 工作流构建
          files: |
            dist/Monster-ww-*.7z
            dist/Monster-ww-*.7z.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}
